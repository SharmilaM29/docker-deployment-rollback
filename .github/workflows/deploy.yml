name: Docker Deployment Rollback

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t rollback-demo:v1 .

      - name: Run container
        run: |
          docker run -d \
            --name rollback-demo \
            -p 8080:80 \
            rollback-demo:v1

      - name: Wait for container
        run: |
          echo "Waiting for container to start..."
          sleep 5
          docker ps -a
          docker logs rollback-demo

      - name: Health check
        run: |
          for i in {1..5}; do
            echo "Health check attempt $i"

            if curl -f http://localhost:8080/health; then
              echo "Health check passed"
            else
              echo "Health check failed"
              docker ps -a
              docker logs rollback-demo
              exit 1
            fi

            sleep 2
          done

      - name: Deployment successful
        run: echo "Deployment and health verification successful"